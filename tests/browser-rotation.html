<!doctype html>
<html lang="en"><meta charset="utf-8"><title>STL2SAS rotation UI check</title>
<style>body{font:14px system-ui;margin:20px;background:#f4f5f1;color:#203b2e}button{padding:12px}iframe{width:100%;height:1000px;border:1px solid #bbb;margin-top:15px}output{margin-left:15px}</style>
<h1>Auto-rotation UI browser check</h1>
<p>Checks stable Live/export controls while results continue updating, exports during rotation, and safe invalidation during resampling.</p>
<button id="run" disabled>Check rotation UI</button><output id="result">Loading app…</output>
<iframe id="app" src="../index.html" title="STL2SAS app under test"></iframe>
<script>
const frame=document.getElementById('app'),button=document.getElementById('run'),output=document.getElementById('result');
frame.addEventListener('load',()=>{button.disabled=false;output.textContent='Ready';});
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function waitUntil(condition){const deadline=performance.now()+30000;while(performance.now()<deadline){if(condition())return;await delay(30);}throw Error('Timed out waiting for app');}
button.addEventListener('click',async()=>{
  button.disabled=true;output.textContent='Running…';delete output.dataset.pass;
  const doc=frame.contentDocument,win=frame.contentWindow,observers=[];
  try{
    const status=doc.getElementById('compute-status'),dataButton=doc.getElementById('export'),profilesButton=doc.getElementById('export-profiles'),auto=doc.getElementById('auto-rotate');
    const ready=()=>doc.getElementById('isotropic-status').dataset.ready==='true'&&!profilesButton.disabled;
    await waitUntil(ready);
    if(auto.getAttribute('aria-pressed')!=='true'||!auto.textContent.includes('Pause rotation'))throw Error('Rotation did not start by default');
    if(auto.getBoundingClientRect().height<44)throw Error('Pause control is too small');
    function exported(id,filename){
      return new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>{doc.removeEventListener('click',capture,true);reject(Error('No export: '+filename));},5000);
        const capture=event=>{const link=event.target.closest('a[download="'+filename+'"]');if(!link)return;event.preventDefault();doc.removeEventListener('click',capture,true);clearTimeout(timer);win.fetch(link.href).then(r=>r.text()).then(resolve,reject);};
        doc.addEventListener('click',capture,true);doc.getElementById(id).click();
      });
    }
    const beforeCSV=await exported('export-profiles','stl2sas-profiles.csv'),changes=[];
    const observe=(node,options)=>{const observer=new win.MutationObserver(records=>changes.push(...records.map(record=>node.id+':'+record.type)));observer.observe(node,options);observers.push(observer);};
    observe(status,{characterData:true,childList:true,subtree:true});
    observe(dataButton,{attributes:true,attributeFilter:['disabled']});
    observe(profilesButton,{attributes:true,attributeFilter:['disabled']});
    const startFrame=Number(status.dataset.frameId),startAngle=doc.getElementById('angle-y').value;
    await waitUntil(()=>Number(status.dataset.frameId)>=startFrame+8);
    await delay(750);
    // Both exports capture a complete frame synchronously, even if a later
    // frame is pending. Their rotation metadata must therefore agree.
    const [planeCSV,profileCSV]=await Promise.all([exported('export','stl2sas-planes.csv'),exported('export-profiles','stl2sas-profiles.csv')]);
    if(!planeCSV.includes('plane,q_a,q_b,I_over_I0\nXY,'))throw Error('Plane export missing data');
    const planeAngles=planeCSV.match(/rotation_xyz_degrees=([^\n]+)/)?.[1],profileAngles=profileCSV.match(/plane_rotation_xyz_degrees=([^\n]+)/)?.[1];
    if(!planeAngles||planeAngles!==profileAngles)throw Error('Exports did not capture the same completed orientation');
    if(profileCSV===beforeCSV)throw Error('Export kept an old orientation during rotation');
    if(doc.getElementById('angle-y').value===startAngle)throw Error('Model did not rotate');
    if(status.textContent.trim()!=='Live'||dataButton.disabled||profilesButton.disabled)throw Error('Controls are not live during rotation');
    auto.click();
    await delay(250);
    const pausedAngle=doc.getElementById('angle-y').value;
    await delay(250);
    if(auto.getAttribute('aria-pressed')!=='false'||!auto.textContent.includes('Start rotation')||doc.getElementById('angle-y').value!==pausedAngle)throw Error('Pause did not stop rotation');
    const pausedFrame=Number(status.dataset.frameId);
    auto.click();
    await waitUntil(()=>Number(status.dataset.frameId)>=pausedFrame+4);
    auto.click();
    await delay(250);
    if(changes.length)throw Error('Live/export controls flickered: '+changes.join(', '));
    observers.forEach(observer=>observer.disconnect());
    doc.getElementById('resample').click();
    if(!dataButton.disabled||!profilesButton.disabled)throw Error('Old point-set results remained exportable during resampling');
    await waitUntil(ready);
    if(auto.getAttribute('aria-pressed')!=='false')throw Error('Resampling lost the paused preference');
    output.textContent='PASS — rotation starts automatically; 44px pause control; pause/resume works; 8+ live frames without flicker; matching CSV exports; resampling preserves pause';
    output.dataset.pass='true';
  }catch(error){output.textContent='FAIL — '+error.message;}
  finally{observers.forEach(observer=>observer.disconnect());const auto=doc.getElementById('auto-rotate');if(auto?.getAttribute('aria-pressed')==='true')auto.click();button.disabled=false;}
});
</script></html>
